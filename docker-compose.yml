# Local infrastructure for GeekPass. The web app itself runs with `dotnet run` (see README).
# Values come from .env (copy .env.example). Stage 5 replaces this file with .NET Aspire.
name: geekpass

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${GEEKPASS_DB_PASSWORD:?Set GEEKPASS_DB_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:${GEEKPASS_DB_PORT:-1433}:1433" # localhost only
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # One-shot job: creates the GeekPass database so Umbraco's unattended install can use it.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${GEEKPASS_DB_PASSWORD}
    entrypoint:
      - /bin/bash
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
        -Q "IF DB_ID('GeekPass') IS NULL CREATE DATABASE [GeekPass];"
    restart: "no"

volumes:
  sqlserver-data:
